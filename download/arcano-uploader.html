; }\n.login-sub { color: var(--text2); margin-top: 2px; font-size: 0.85rem; }\n.login-form { margin-top: 24px; text-align: left; }\n.login-form label {\n  display: block; font-size: 0.75rem; font-weight: 600;\n  color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;\n}\n.login-form .input { text-align: center; font-size: 1.3rem; letter-spacing: 0.3em; margin-bottom: 16px; }\n\n/* ==================== MODAL ==================== */\n.modal-overlay {\n  position: fixed; top: 0; left: 0; right: 0; bottom: 0;\n  background: rgba(0,0,0,0.7); display: flex; align-items: center;\n  justify-content: center; z-index: 1000; padding: 20px;\n  animation: fadeIn 0.15s ease;\n}\n@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n.modal {\n  background: var(--bg2); border: 1px solid var(--bg4);\n  border-radius: 12px; width: 100%; max-width: 480px;\n  box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto;\n}\n.modal-lg { max-width: 640px; }\n.modal-header {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 16px 20px; border-bottom: 1px solid var(--bg4);\n}\n.modal-header h3 { font-size: 1rem; font-weight: 700; }\n.modal-body { padding: 20px; }\n.modal-footer {\n  padding: 12px 20px; border-top: 1px solid var(--bg4);\n  display: flex; justify-content: flex-end; gap: 8px;\n}\n\n/* ---------- Responsive sidebar ---------- */\n@media (max-width: 768px) {\n  .sidebar {\n    position: fixed; top: 0; left: 0; bottom: 0; z-index: 500;\n    width: var(--sidebar-w) !important;\n    transform: translateX(-100%);\n    transition: transform var(--transition);\n  }\n  .sidebar.mobile-open { transform: translateX(0); }\n  .sidebar-closed .sidebar { transform: translateX(-100%); }\n}\n\n/* ==================== ETIQUETAS ==================== */\n.etiquetas-grid {\n  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: 12px;\n}\n.etiqueta-card {\n  background: var(--bg); border: 1px solid var(--bg4);\n  border-radius: var(--radius); padding: 16px; text-align: center;\n  border-top: 3px solid var(--gold);\n}\n.etiqueta-label {\n  font-size: 1rem; font-weight: 800; color: var(--gold);\n  margin-bottom: 6px; word-break: break-word;\n}\n.etiqueta-cat { margin-bottom: 8px; }\n.etiqueta-stock {\n  font-size: 1.8rem; font-weight: 900; color: var(--text);\n  line-height: 1.2;\n}\n.etiqueta-prices {\n  display: flex; justify-content: center; gap: 16px;\n  font-size: 0.72rem; color: var(--text2); margin-top: 6px;\n}\n.etiqueta-actions {\n  display: flex; justify-content: center; gap: 6px; margin-top: 10px;\n}\n.venta-total-box {\n  background: var(--bg); border: 1px solid var(--bg4);\n  border-radius: var(--radius-sm); padding: 10px 14px;\n  font-size: 1.3rem; font-weight: 800; color: var(--gold);\n  text-align: center; min-height: 42px; display: flex;\n  align-items: center; justify-content: center;\n}\n\n/* ---------- Tabs ---------- */\n.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }\n.tab { padding: 10px 24px; border: none; background: none; color: var(--text3); font-size: .9rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; }\n.tab:hover { color: var(--text2); }\n.tab.active { color: var(--gold); border-bottom-color: var(--gold); }\n.tab-count { background: var(--bg3); color: var(--text3); font-size: .7rem; padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-weight: 700; }\n.tab.active .tab-count { background: var(--gold); color: var(--bg); }\n\n/* ---------- Tag Chips ---------- */\n.tag-selector { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }\n.tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; font-size: .8rem; color: var(--text2); transition: all .15s; user-select: none; }\n.tag-chip input { display: none; }\n.tag-chip input:checked + span { background: var(--gold); color: var(--bg); border-radius: 16px; padding: 2px 8px; }\n.tag-chip:hover { border-color: var(--gold); }\n.tag-chip-admin { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 20px; background: var(--bg2); border: 1px solid var(--border); font-size: .8rem; color: var(--text2); }\n.tag-chip-admin button { background: none; border: none; cursor: pointer; color: var(--red); font-size: .9rem; padding: 0 2px; line-height: 1; }\n\n/* ---------- Image Upload ---------- */\n.img-upload-area { position: relative; }\n.img-upload-placeholder { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; color: var(--text3); font-size: 0.85rem; transition: border-color 0.2s; }\n.img-upload-placeholder:hover { border-color: var(--gold); color: var(--gold); }\n.img-preview { width: 100%; max-width: 200px; max-height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; margin-bottom: 4px; }\n\n/* ---------- Scrollbar ---------- */\n::-webkit-scrollbar { width: 6px; height: 6px; }\n::-webkit-scrollbar-track { background: var(--bg); }\n::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 3px; }\n::-webkit-scrollbar-thumb:hover { background: var(--text3); }","js/db.js":"/* ===================== ARCANO V3 — DATA LAYER =====================\n   Flujo:\n     Insumos → Stock (pala grs, envases, stickers, bolsas)\n     Produccion → consume insumos → Frascos listos (chico / grande)\n     Ventas → consume frascos\n\n   Stock por especia: stockBolsa (grs), stockChico, stockGrande (frascos)\n   Stock por blend:   stockChico, stockGrande (frascos)\n   Stock global:      stockEnvases (chico/grande), stockBolsas (chico/grande)\n   Stickers:           por producto, stockChico, stockGrande\n   ===================== */\n\nconst DB_KEY = 'arcano_v3';\nconst FB_PATH = 'arcano/db';\nconst DB_VERSION = 3;\n\nconst FIREBASE_CONFIG = {\n  apiKey: \"AIzaSyBvuJusx4_FvAdXhBl89VVlCicNb-yrdzo\",\n  authDomain: \"arcano-6788d.firebaseapp.com\",\n  databaseURL: \"https://arcano-6788d-default-rtdb.firebaseio.com\",\n  projectId: \"arcano-6788d\",\n  storageBucket: \"arcano-6788d.appspot.com\",\n  messagingSenderId: \"544197982462\",\n  appId: \"1:544197982462:web:4e8d7e3e4a9e7c6c7b3a2d\"\n};\n\nvar _db = null;\nvar _ready = false;\nvar _saveTimer = null;\nvar _listeners = [];\nvar _localDirty = false;  // prevents Firebase listener from overwriting pending saves\n\nvar DEFAULT_IDS = { especias: 1, blends: 1, producciones: 1, ventas: 1, entradas: 1, stickers: 1, ajustes: 1 };\n\n/* ==================== HELPERS ==================== */\n\nfunction _filterValid(arr) {\n  return arr.filter(function(o) { return o && typeof o === 'object'; });\n}\n\nfunction _cleanNulls() {\n  var cols = ['especias', 'blends', 'producciones', 'ventas', 'entradas', 'stickers', 'ajustes'];\n  for (var c = 0; c < cols.length; c++) {\n    var col = cols[c];\n    if (!_db[col]) { _db[col] = {}; continue; }\n    var keys = Object.keys(_db[col]);\n    for (var j = 0; j < keys.length; j++) {\n      if (_db[col][keys[j]] == null || typeof _db[col][keys[j]] !== 'object') {\n        delete _db[col][keys[j]];\n      }\n    }\n  }\n}\n\nfunction _ensureStructure() {\n  if (!_db || typeof _db !== 'object' || Array.isArray(_db)) {\n    _db = null;\n    return false;\n  }\n  if (!_db.meta || !_db.meta.nextId) {\n    _db.meta = { nextId: Object.assign({}, DEFAULT_IDS), version: DB_VERSION };\n  } else {\n    _db.meta.version = DB_VERSION;\n    for (var k in DEFAULT_IDS) {\n      if (typeof _db.meta.nextId[k] !== 'number') _db.meta.nextId[k] = DEFAULT_IDS[k];\n    }\n  }\n  if (!_db.especias) _db.especias = {};\n  if (!_db.blends) _db.blends = {};\n  if (!_db.producciones) _db.producciones = {};\n  if (!_db.ventas) _db.ventas = {};\n  if (!_db.entradas) _db.entradas = {};\n  if (!_db.stickers) _db.stickers = {};\n  if (!_db.ajustes) _db.ajustes = {};\n  // Migration: copy old etiquetas data to stickers\n  if (_db.etiquetas && Object.keys(_db.etiquetas).length > 0 && Object.keys(_db.stickers).length === 0) {\n    _db.stickers = _db.etiquetas;\n  }\n  delete _db.etiquetas;\n  if (!_db.stockEnvases) _db.stockEnvases = { chico: 0, grande: 0 };\n  if (!_db.stockBolsas) _db.stockBolsas = { chico: 0, grande: 0 };\n  if (!_db.usuarios) _db.usuarios = {\n    admin: { id: 'admin', nombre: 'Administrador', pin: '1234', rol: 'admin', activo: true, creado: new Date().toISOString() }\n  };\n  if (!_db.productTags) _db.productTags = {\n    'Comidas': ['Aves', 'Pescados y Mariscos', 'Cerdo', 'Salsas y Aderezos', 'Verduras y Vegetales', 'Granos y Legumbres'],\n    'Infusiones': ['Relajante', 'Digestiva', 'Energética', 'Citrica', 'Refrescante', 'Detox', 'Aromatica'],\n    'Cocteleria': ['Tropical', 'Citrica', 'Seca', 'Dulce']\n  };\n  _cleanNulls();\n  return true;\n}\n\nfunction _emptyDB() {\n  return {\n    meta: { nextId: Object.assign({}, DEFAULT_IDS), version: DB_VERSION },\n    especias: {}, blends: {}, producciones: {}, ventas: {}, entradas: {}, stickers: {}, ajustes: {},\n    stockEnvases: { chico: 0, grande: 0 },\n    stockBolsas: { chico: 0, grande: 0 },\n    productTags: {\n      'Comidas': ['Aves', 'Pescados y Mariscos', 'Cerdo', 'Salsas y Aderezos', 'Verduras y Vegetales', 'Granos y Legumbres'],\n      'Infusiones': ['Relajante', 'Digestiva', 'Energética', 'Citrica', 'Refrescante', 'Detox', 'Aromatica'],\n      'Cocteleria': ['Tropical', 'Citrica', 'Seca', 'Dulce']\n    },\n    usuarios: { admin: { id: 'admin', nombre: 'Administrador', pin: '1234', rol: 'admin', activo: true, creado: new Date().toISOString() } }\n  };\n}\n\nfunction nextId(col) {\n  if (!_db.meta.nextId[col]) _db.meta.nextId[col] = 1;\n  var id = _db.meta.nextId[col]++;\n  return id;\n}\n\n/* ==================== FIREBASE ==================== */\n\nvar _firebaseApp = null;\nvar _firebaseDb = null;\nvar _firebaseRef = null;\n\n/* === Pedidos (path arcano/db/pedidos) === */\nvar _pedidos = [];           // in-memory list of orders from tienda\nvar _pedidosRef = null;      // Firebase ref for arcano/db/pedidos\nvar _pedidosListeners = [];  // callbacks when new pedido arrives\n\nfunction _initFirebase() {\n  if (_firebaseDb) return;\n  try {\n    _firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);\n    _firebaseDb = firebase.database();\n    _firebaseRef = _firebaseDb.ref(FB_PATH);\n    _pedidosRef = _firebaseDb.ref('arcano/db/pedidos');\n  } catch (e) {\n    console.error('[DB] Firebase init error:', e);\n  }\n}\n\nfunction _saveToFirebase() {\n  if (!_firebaseRef) return;\n  _localDirty = true;\n  clearTimeout(_saveTimer);\n  _saveTimer = setTimeout(function() {\n    try {\n      var safetyTimer = setTimeout(function() { _localDirty = false; }, 5000);\n      _firebaseRef.update(_db, function(error) {\n        clearTimeout(safetyTimer);\n        _localDirty = false;\n        if (error) console.error('[DB] Firebase save error:', error);\n      });\n    } catch (e) {\n      console.error('[DB] Firebase save error:', e);\n      _localDirty = false;\n    }\n  }, 500);\n}\n\nfunction _notify(type, col, id) {\n  for (var i = 0; i < _listeners.length; i++) {\n    try { _listeners[i](type, col, id); } catch (e) {}\n  }\n}\n\n/* ==================== INIT ==================== */\n\nfunction initDB() {\n  return new Promise(function(resolve) {\n    _initFirebase();\n\n    // Always try localStorage cache for instant UI\n    var cached = null;\n    try { cached = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) {}\n\n    if (cached && cached.meta && cached.meta.version === DB_VERSION && _ensureStructureOn(cached)) {\n      _db = cached;\n      _ensureStructure();  // ensure new fields exist on cached data\n      _ready = true;\n      _startFirebaseListener();\n      _startPedidosListener();\n      resolve();\n      return;\n    }\n\n    // Load from Firebase\n    if (_firebaseRef) {\n      _firebaseRef.once('value').then(function(snap) {\n        var fbData = snap.val();\n        if (fbData && fbData.meta && fbData.meta.version === DB_VERSION && _ensureStructureOn(fbData)) {\n          delete fbData.pedidos;  // pedidos managed separately, not part of admin _db\n          _db = fbData;\n          _ensureStructure();  // ensure new fields exist on Firebase data\n        } else {\n          _db = _emptyDB();\n          _ensureStructure();\n          _saveToFirebase();\n        }\n        _ready = true;\n        _cacheLocal();\n        _startFirebaseListener();\n        _startPedidosListener();\n        resolve();\n      }).catch(function() {\n        _db = _emptyDB();\n        _ensureStructure();\n        _ready = true;\n        resolve();\n      });\n    } else {\n      _db = _emptyDB();\n      _ensureStructure();\n      _ready = true;\n      resolve();\n    }\n  });\n}\n\nfunction _ensureStructureOn(data) {\n  if (!data || typeof data !== 'object') return false;\n  if (!data.meta || !data.meta.version) return false;\n  if (data.meta.version !== DB_VERSION) return false;\n  // Basic check\n  if (!data.especias || !data.blends) return false;\n  return true;\n}\n\nfunction _cacheLocal() {\n  try { localStorage.setItem(DB_KEY, JSON.stringify(_db)); } catch (e) {}\n}\n\nfunction _startFirebaseListener() {\n  if (!_firebaseRef) return;\n  _firebaseRef.on('value', function(snap) {\n    var data = snap.val();\n    if (!data || !data.meta || data.meta.version !== DB_VERSION) return;\n    // CRITICAL: skip if local save is pending to prevent overwriting unsaved changes\n    if (_localDirty) return;\n    delete data.pedidos;  // pedidos managed separately, not part of admin _db\n    var prevJson = JSON.stringify(_db);\n    _db = data;\n    _ensureStructure();\n    _cacheLocal();\n    var newJson = JSON.stringify(_db);\n    if (prevJson !== newJson) {\n      _notify('remote_change', '', '');\n    }\n  });\n}\n\nfunction _startPedidosListener() {\n  if (!_pedidosRef) return;\n  var _prevNuevoKeys = {};\n  _pedidosRef.on('value', function(snap) {\n    var data = snap.val();\n    var prevLen = _pedidos.length;\n    var prevNuevoKeys = Object.assign({}, _prevNuevoKeys);\n    _pedidos = [];\n    var nuevoKeys = {};\n    if (data) {\n      var keys = Object.keys(data);\n      for (var i = 0; i < keys.length; i++) {\n        var p = data[keys[i]];\n        if (p && typeof p === 'object') {\n          p._key = keys[i];\n          _pedidos.push(p);\n          if (p.estado === 'nuevo') nuevoKeys[keys[i]] = true;\n        }\n      }\n    }\n    _pedidos.sort(function(a, b) { return (b.creado || '').localeCompare(a.creado || ''); });\n    _prevNuevoKeys = nuevoKeys;\n    // Detect new pedido: a key in nuevoKeys that was NOT in prevNuevoKeys\n    var hasNew = false;\n    var nk = Object.keys(nuevoKeys);\n    for (var n = 0; n < nk.length; n++) {\n      if (!prevNuevoKeys[nk[n]]) { hasNew = true; break; }\n    }\n    _notifyPedidos(hasNew, _pedidos.length !== prevLen);\n  });\n}\n\nfunction _notifyPedidos(isNew, countChanged) {\n  for (var i = 0; i < _pedidosListeners.length; i++) {\n    try { _pedidosListeners[i](_pedidos, isNew, countChanged); } catch (e) {}\n  }\n}\n\nfunction onPedidosChange(fn) { _pedidosListeners.push(fn); }\n\nfunction getPedidos() {\n  return _pedidos.slice();\n}\n\nfunction getPedidosCount(estado) {\n  if (!estado) return _pedidos.length;\n  var c = 0;\n  for (var i = 0; i < _pedidos.length; i++) { if (_pedidos[i].estado === estado) c++; }\n  return c;\n}\n\nfunction updatePedidoEstado(pedidoKey, nuevoEstado) {\n  if (!_pedidosRef) return;\n  _pedidosRef.child(pedidoKey + '/estado').set(nuevoEstado);\n}\n\nfunction deletePedido(pedidoKey) {\n  if (!_pedidosRef) return;\n  _pedidosRef.child(pedidoKey).remove();\n}\n\nfunction onDBChange(fn) { _listeners.push(fn); }\n\n/* ==================== GETTERS ==================== */\n\nfunction getDB() { return _db; }\n\nfunction getEspecias() {\n  return _filterValid(Object.values(_db.especias || {})).sort(function(a, b) { return (a.nombre || '').localeCompare(b.nombre || ''); });\n}\nfunction getEspecia(id) { return _db.especias[id] || null; }\n\nfunction getBlends() {\n  return _filterValid(Object.values(_db.blends || {})).sort(function(a, b) { return (a.nombre || '').localeCompare(b.nombre || ''); });\n}\nfunction getBlend(id) { return _db.blends[id] || null; }\n\nfunction getStickers() {\n  return _filterValid(Object.values(_db.stickers || {})).sort(function(a, b) { return (a.nombre || '').localeCompare(b.nombre || ''); });\n}\n\nfunction getEntradas() {\n  return _filterValid(Object.values(_db.entradas || {})).sort(function(a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); });\n}\nfunction getProducciones() {\n  return _filterValid(Object.values(_db.producciones || {})).sort(function(a, b) { return (b.creado || '').localeCompare(a.creado || ''); });\n}\nfunction getVentas() {\n  return _filterValid(Object.values(_db.ventas || {})).sort(function(a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); });\n}\n\n/* ==================== ESPECIAS ==================== */\n\nfunction saveEspecia(data) {\n  _ensureStructure();\n  var isNew = !data.id;\n  if (isNew) {\n    data.id = nextId('especias');\n    data.creado = new Date().toISOString();\n  } else {\n    var existing = _db.especias[data.id];\n    if (existing) {\n      data.stockBolsa = Number(existing.stockBolsa) || 0;\n      data.stockChico = Number(existing.stockChico) || 0;\n      data.stockGrande = Number(existing.stockGrande) || 0;\n      data.creado = existing.creado;\n    }\n  }\n  data.nombre = (data.nombre || '').trim();\n  data.categoria = data.categoria || 'Comidas';\n  data.precioChico = Number(data.precioChico) || 0;\n  data.precioGrande = Number(data.precioGrande) || 0;\n  data.gramosChico = Number(data.gramosChico) || 0;\n  data.gramosGrande = Number(data.gramosGrande) || 0;\n  data.stockBolsa = Number(data.stockBolsa) || 0;\n  data.stockChico = Number(data.stockChico) || 0;\n  data.stockGrande = Number(data.stockGrande) || 0;\n  _db.especias[data.id] = data;\n  _saveToFirebase(); _cacheLocal();\n  _notify(isNew ? 'create' : 'update', 'especias', data.id);\n  return data;\n}\n\nfunction deleteEspecia(id) {\n  if (!_db.especias[id]) return false;\n  delete _db.especias[id];\n  _saveToFirebase(); _cacheLocal();\n  _notify('delete', 'especias', id);\n  return true;\n}\n\n/* ==================== BLENDS ==================== */\n\nfunction saveBlend(data) {\n  _ensureStructure();\n  var isNew = !data.id;\n  if (isNew) {\n    data.id = nextId('blends');\n    data.creado = new Date().toISOString();\n  } else {\n    var existing = _db.blends[data.id];\n    if (existing) {\n      data.stockChico = Number(existing.stockChico) || 0;\n      data.stockGrande = Number(existing.stockGrande) || 0;\n      data.creado = existing.creado;\n    }\n  }\n  data.nombre = (data.nombre || '').trim();\n  data.categoria = data.categoria || 'Comidas';\n  data.precioChico = Number(data.precioChico) || 0;\n  data.precioGrande = Number(data.precioGrande) || 0;\n  data.ingredientes = data.ingredientes || [];\n  data.stockChico = Number(data.stockChico) || 0;\n  data.stockGrande = Number(data.stockGrande) || 0;\n  _db.blends[data.id] = data;\n  _saveToFirebase(); _cacheLocal();\n  _notify(isNew ? 'create' : 'update', 'blends', data.id);\n  return data;\n}\n\nfunction deleteBlend(id) {\n  if (!_db.blends[id]) return false;\n  delete _db.blends[id];\n  _saveToFirebase(); _cacheLocal();\n  _notify('delete', 'blends', id);\n  return true;\n}\n\n/* ==================== STICKERS ==================== */\n\nfunction _findStickerByNombre(nombre) {\n  var keys = Object.keys(_db.stickers || {});\n  for (var i = 0; i < keys.length; i++) {\n    if (_db.stickers[keys[i]].nombre === nombre) return _db.stickers[keys[i]];\n  }\n  return null;\n}\n\nfunction _getOrCreateSticker(nombre) {\n  if (!_db.stickers) _db.stickers = {};\n  var existing = _findStickerByNombre(nombre);\n  if (existing) return existing;\n  var id = nextId('stickers');\n  var nueva = { id: id, nombre: nombre, stockChico: 0, stockGrande: 0, creado: new Date().toISOString() };\n  _db.stickers[id] = nueva;\n  return nueva;\n}\n\n/** Get all products (especias+blends) with their sticker stock merged */\nfunction getProductosConStickers() {\n  var items = [];\n  var espKeys = Object.keys(_db.especias || {});\n  for (var i = 0; i < espKeys.length; i++) {\n    var e = _db.especias[espKeys[i]];\n    if (!e || typeof e !== 'object') continue;\n    var stk = _findStickerByNombre(e.nombre);\n    items.push({\n      id: e.id, nombre: e.nombre || '', tipo: 'especia', categoria: e.categoria || '',\n      stockChico: stk ? (Number(stk.stockChico) || 0) : 0,\n      stockGrande: stk ? (Number(stk.stockGrande) || 0) : 0\n    });\n  }\n  var blKeys = Object.keys(_db.blends || {});\n  for (var i = 0; i < blKeys.length; i++) {\n    var b = _db.blends[blKeys[i]];\n    if (!b || typeof b !== 'object') continue;\n    var stk = _findStickerByNombre(b.nombre);\n    items.push({\n      id: b.id, nombre: b.nombre || '', tipo: 'blend', categoria: b.categoria || '',\n      stockChico: stk ? (Number(stk.stockChico) || 0) : 0,\n      stockGrande: stk ? (Number(stk.stockGrande) || 0) : 0\n    });\n  }\n  return items.sort(function(a, b) { return a.nombre.localeCompare(b.nombre); });\n}\n\n/* ==================== ENTRADAS (Insumos) ==================== */\n\nfunction saveEntrada(data) {\n  _ensureStructure();\n  var isNew = !data.id;\n  if (isNew) {\n    data.id = nextId('entradas');\n    data.creado = new Date().toISOString();\n    data.fecha = data.fecha || new Date().toISOString().slice(0, 10);\n    data.items = data.items || [];\n    data.total = Number(data.total) || 0;\n  }\n  if (isNew) {\n    for (var i = 0; i < data.items.length; i++) {\n      var item = data.items[i];\n      var tipo = item.tipo;\n      if (tipo === 'especia_grs') {\n unction(s, b) { return s + (b.stockGrande || 0); }, 0);\n\n  var stkBajo = stickers.filter(function(e) { return (e.stockChico + e.stockGrande) <= 5; });\n  var espBolsaBaja = especias.filter(function(e) { return (e.stockBolsa || 0) <= 50; });\n\n  return {\n    totalEspecias: especias.length,\n    totalBlends: blends.length,\n    totalProductos: especias.length + blends.length,\n    frascosChico: frascosChico,\n    frascosGrande: frascosGrande,\n    totalFrascos: frascosChico + frascosGrande,\n    envasesChico: envases.chico || 0,\n    envasesGrande: envases.grande || 0,\n    bolsasChico: bolsas.chico || 0,\n    bolsasGrande: bolsas.grande || 0,\n    ventasHoy: ventasHoy.length,\n    totalVentasHoy: ventasHoy.reduce(function(s, v) { return s + (Number(v.total) || 0); }, 0),\n    ventasMes: ventasMes.length,\n    totalVentasMes: ventasMes.reduce(function(s, v) { return s + (Number(v.total) || 0); }, 0),\n    especiasBolsaBaja: espBolsaBaja,\n    stickersBajos: stkBajo\n  };\n}\n\n/** Items for venta selection: products with frascos > 0 */\nfunction getFrascosParaVender() {\n  var items = [];\n  var espKeys = Object.keys(_db.especias || {});\n  for (var i = 0; i < espKeys.length; i++) {\n    var e = _db.especias[espKeys[i]];\n    if (!e || typeof e !== 'object') continue;\n    if ((e.stockChico || 0) > 0) items.push({ tipo: 'especia', id: e.id, nombre: e.nombre, talla: 'chico', stock: e.stockChico, precio: e.precioChico || 0 });\n    if ((e.stockGrande || 0) > 0) items.push({ tipo: 'especia', id: e.id, nombre: e.nombre, talla: 'grande', stock: e.stockGrande, precio: e.precioGrande || 0 });\n  }\n  var blKeys = Object.keys(_db.blends || {});\n  for (var i = 0; i < blKeys.length; i++) {\n    var b = _db.blends[blKeys[i]];\n    if (!b || typeof b !== 'object') continue;\n    if ((b.stockChico || 0) > 0) items.push({ tipo: 'blend', id: b.id, nombre: b.nombre, talla: 'chico', stock: b.stockChico, precio: b.precioChico || 0 });\n    if ((b.stockGrande || 0) > 0) items.push({ tipo: 'blend', id: b.id, nombre: b.nombre, talla: 'grande', stock: b.stockGrande, precio: b.precioGrande || 0 });\n  }\n  return items.sort(function(a, b) { return a.nombre.localeCompare(b.nombre); });\n}\n\n/* ==================== TIENDA (STORE) ==================== */\n\n/** Products visible in the public store (enTienda=true, stock>0) */\nfunction getTiendaProductos() {\n  var products = [];\n  var espKeys = Object.keys(_db.especias || {});\n  for (var i = 0; i < espKeys.length; i++) {\n    var e = _db.especias[espKeys[i]];\n    if (!e || !e.enTienda) continue;\n    if ((e.stockChico || 0) <= 0 && (e.stockGrande || 0) <= 0) continue;\n    products.push({\n      id: e.id, nombre: e.nombre, tipo: 'especia', categoria: e.categoria || 'Comidas',\n      precioChico: Number(e.precioTiendaChico) || Number(e.precioChico) || 0,\n      precioGrande: Number(e.precioTiendaGrande) || Number(e.precioGrande) || 0,\n      stockChico: e.stockChico || 0, stockGrande: e.stockGrande || 0,\n      region: '', uso: ''\n    });\n  }\n  var blKeys = Object.keys(_db.blends || {});\n  for (var i = 0; i < blKeys.length; i++) {\n    var b = _db.blends[blKeys[i]];\n    if (!b || !b.enTienda) continue;\n    if ((b.stockChico || 0) <= 0 && (b.stockGrande || 0) <= 0) continue;\n    products.push({\n      id: b.id, nombre: b.nombre, tipo: 'blend', categoria: b.categoria || 'Comidas',\n      precioChico: Number(b.precioTiendaChico) || Number(b.precioChico) || 0,\n      precioGrande: Number(b.precioTiendaGrande) || Number(b.precioGrande) || 0,\n      stockChico: b.stockChico || 0, stockGrande: b.stockGrande || 0,\n      region: b.region || '', uso: b.uso || ''\n    });\n  }\n  return products.sort(function(a, b) { return a.nombre.localeCompare(b.nombre); });\n}\n\n/** Toggle enTienda for a product */\nfunction toggleTienda(tipo, id) {\n  if (tipo === 'especia' && _db.especias[id]) {\n    _db.especias[id].enTienda = !_db.especias[id].enTienda;\n  } else if (tipo === 'blend' && _db.blends[id]) {\n    _db.blends[id].enTienda = !_db.blends[id].enTienda;\n  } else return;\n  _saveToFirebase(); _cacheLocal();\n  _notify('update', tipo === 'especia' ? 'especias' : 'blends', id);\n}\n\n/* ==================== EXCEL IMPORT ==================== */\n\n/** Find especia by name with flexible matching (exact, prefix, contains, word overlap) */\nfunction findEspeciaByName(nombre) {\n  if (!nombre) return null;\n  var target = nombre.trim().toLowerCase();\n  var keys = Object.keys(_db.especias || {});\n  // 1. Exact match\n  for (var i = 0; i < keys.length; i++) {\n    var e = _db.especias[keys[i]];\n    if (e && (e.nombre || '').trim().toLowerCase() === target) return e;\n  }\n  // 2. Especia name starts with target (e.g. \"Color\" matches \"Color (achiote/...)\")\n  for (var i = 0; i < keys.length; i++) {\n    var e = _db.especias[keys[i]];\n    if (e && (e.nombre || '').trim().toLowerCase().indexOf(target) === 0) return e;\n  }\n  // 3. Target is contained in especia name\n  for (var i = 0; i < keys.length; i++) {\n    var e = _db.especias[keys[i]];\n    if (e && (e.nombre || '').trim().toLowerCase().indexOf(target) >= 0) return e;\n  }\n  // 4. Word overlap: any word (len>=4) from target appears in especia name\n  var targetWords = target.split(/[\\s()\\/,]+/).filter(function(w) { return w.length >= 4; });\n  for (var w = 0; w < targetWords.length; w++) {\n    for (var i = 0; i < keys.length; i++) {\n      var e = _db.especias[keys[i]];\n      if (e && (e.nombre || '').trim().toLowerCase().indexOf(targetWords[w]) >= 0) return e;\n    }\n  }\n  return null;\n}\n\n/** Auto-detect categoria from blend USO field */\nfunction _categoriaFromUso(uso) {\n  if (!uso) return 'Comidas';\n  var u = uso.toLowerCase();\n  // Cocteleria keywords\n  if (/\\b(gin|ron|vodka|whisky|mojito|mule|vermouth|aperitif|coctel)\\b/.test(u)) return 'Cocteleria';\n  // Infusiones keywords\n  if (/\\b(relajant|sueño|digestiv|energiz|té|calidez|respiratorio|meditaci|antioxidant|bienestar|infusi)\\b/.test(u)) return 'Infusiones';\n  return 'Comidas';\n}\n\n/**\n * Import especias and blends from parsed Excel data.\n * Returns { especiasCreadas: N, blendsCreados: N, blendsParciales: N, errores: [] }\n *\n * especiasList: [{ nombre, categoria? }]\n * blendsList:   [{ nombre, region, uso, categoria, ingredientes: [{ especia, g, pct }] }]\n * gramosChico:  default grams for frasco chico (e.g. 30)\n * gramosGrande: default grams for frasco grande (e.g. 80)\n */\nfunction importFromExcelData(especiasList, blendsList, gramosChico, gramosGrande) {\n  _ensureStructure();\n  var resultado = { especiasCreadas: 0, especiasExistentes: 0, blendsCreados: 0, blendsExistentes: 0, ingredientesNoResueltos: [], errores: [] };\n\n  // 1. Create especias (skip if name already exists)\n  for (var i = 0; i < especiasList.length; i++) {\n    var esp = especiasList[i];\n    var nombre = (esp.nombre || '').trim();\n    if (!nombre) continue;\n    var existing = findEspeciaByName(nombre);\n    if (existing) {\n      resultado.especiasExistentes++;\n      continue;\n    }\n    saveEspecia({\n      nombre: nombre,\n      categoria: esp.categoria || 'Comidas',\n      precioChico: 0,\n      precioGrande: 0,\n      gramosChico: Number(gramosChico) || 30,\n      gramosGrande: Number(gramosGrande) || 80,\n      stockBolsa: 0,\n      stockChico: 0,\n      stockGrande: 0\n    });\n    resultado.especiasCreadas++;\n  }\n\n  // 2. Create blends (skip if name already exists)\n  for (var j = 0; j < blendsList.length; j++) {\n    var bl = blendsList[j];\n    var nombre = (bl.nombre || '').trim();\n    if (!nombre) continue;\n    var existingBlend = null;\n    var blKeys = Object.keys(_db.blends || {});\n    for (var k = 0; k < blKeys.length; k++) {\n      if ((_db.blends[blKeys[k]].nombre || '').trim().toLowerCase() === nombre.toLowerCase()) {\n        existingBlend = _db.blends[blKeys[k]];\n        break;\n      }\n    }\n    if (existingBlend) {\n      resultado.blendsExistentes++;\n      continue;\n    }\n\n    // Resolve ingredients: map specia names to IDs and calculate grams per frasco\n    var ings = bl.ingredientes || [];\n    var recipeTotal = 0;\n    for (var ii = 0; ii < ings.length; ii++) recipeTotal += (Number(ings[ii].g) || 0);\n    if (recipeTotal <= 0) recipeTotal = 500;\n\n    var resolvedIngs = [];\n    for (var ii = 0; ii < ings.length; ii++) {\n      var ing = ings[ii];\n      var espObj = findEspeciaByName(ing.especia);\n      if (!espObj) {\n        resultado.ingredientesNoResueltos.push(nombre + ' → ' + (ing.especia || '?'));\n        continue;\n      }\n      var ingG = Number(ing.g) || 0;\n      resolvedIngs.push({\n        especiaId: espObj.id,\n        especiaNombre: espObj.nombre,\n        gramosChico: Math.round((ingG / recipeTotal) * (Number(gramosChico) || 30) * 100) / 100,\n        gramosGrande: Math.round((ingG / recipeTotal) * (Number(gramosGrande) || 80) * 100) / 100,\n        gramosReceta: ingG\n      });\n    }\n\n    var cat = bl.categoria || _categoriaFromUso(bl.uso);\n    saveBlend({\n      nombre: nombre,\n      categoria: cat,\n      region: bl.region || '',\n      uso: bl.uso || '',\n      precioChico: 0,\n      precioGrande: 0,\n      ingredientes: resolvedIngs,\n      stockChico: 0,\n      stockGrande: 0\n    });\n    resultado.blendsCreados++;\n  }\n\n  return resultado;\n}\n\n/* ==================== PRODUCT TAGS ==================== */\n\nfunction getProductTags() {\n  _ensureStructure();\n  return _db.productTags || {};\n}\n\nfunction getTagsForCategoria(cat) {\n  var tags = getProductTags();\n  return tags[cat] || [];\n}\n\nfunction addProductTag(cat, tagName) {\n  _ensureStructure();\n  tagName = (tagName || '').trim();\n  if (!tagName) return false;\n  if (!_db.productTags) _db.productTags = {};\n  if (!_db.productTags[cat]) _db.productTags[cat] = [];\n  // Check duplicate (case-insensitive)\n  for (var i = 0; i < _db.productTags[cat].length; i++) {\n    if (_db.productTags[cat][i].toLowerCase() === tagName.toLowerCase()) return false;\n  }\n  _db.productTags[cat].push(tagName);\n  _saveToFirebase(); _cacheLocal();\n  return true;\n}\n\nfunction removeProductTag(cat, tagName) {\n  _ensureStructure();\n  if (!_db.productTags || !_db.productTags[cat]) return false;\n  var idx = -1;\n  for (var i = 0; i < _db.productTags[cat].length; i++) {\n    if (_db.productTags[cat][i] === tagName) { idx = i; break; }\n  }\n  if (idx < 0) return false;\n  _db.productTags[cat].splice(idx, 1);\n  // Also remove from all products that have this tag\n  var allEsp = getEspecias();\n  for (var e = 0; e < allEsp.length; e++) {\n    if (allEsp[e].tags) {\n      var ti = allEsp[e].tags.indexOf(tagName);\n      if (ti >= 0) { allEsp[e].tags.splice(ti, 1); }\n    }\n  }\n  var allBl = getBlends();\n  for (var b = 0; b < allBl.length; b++) {\n    if (allBl[b].tags) {\n      var bi = allBl[b].tags.indexOf(tagName);\n      if (bi >= 0) { allBl[b].tags.splice(bi, 1); }\n    }\n  }\n  _saveToFirebase(); _cacheLocal();\n  return true;\n}\n\n/* ==================== IMAGE HELPER ==================== */\n\nfunction compressImage(file, maxW, quality, cb) {\n  var reader = new FileReader();\n  reader.onload = function(ev) {\n    var img = new Image();\n    img.onload = function() {\n      var w = img.width, h = img.height;\n      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }\n      var canvas = document.createElement('canvas');\n      canvas.width = w; canvas.height = h;\n      var ctx = canvas.getContext('2d');\n      ctx.drawImage(img, 0, 0, w, h);\n      var dataUrl = canvas.toDataURL('image/jpeg', quality);\n      cb(null, dataUrl);\n    };\n    img.onerror = function() { cb('Error al cargar imagen'); };\n    img.src = ev.target.result;\n  };\n  reader.onerror = function() { cb('Error al leer archivo'); };\n  reader.readAsDataURL(file);\n}\n\n/* ==================== EXPORT ==================== */\n\nwindow.ArcanoDB = {\n  initDB: initDB, getDB: getDB, onDBChange: onDBChange, nextId: nextId,\n  getEspecias: getEspecias, getEspecia: getEspecia, saveEspecia: saveEspecia, deleteEspecia: deleteEspecia,\n  getBlends: getBlends, getBlend: getBlend, saveBlend: saveBlend, deleteBlend: deleteBlend,\n  getStickers: getStickers, getProductosConStickers: getProductosConStickers,\n  getEntradas: getEntradas, saveEntrada: saveEntrada, deleteEntrada: deleteEntrada,\n  getAjustes: getAjustes, saveAjuste: saveAjuste, deleteAjuste: deleteAjuste,\n  getPedidos: getPedidos, getPedidosCount: getPedidosCount, updatePedidoEstado: updatePedidoEstado, deletePedido: deletePedido, onPedidosChange: onPedidosChange,\n  producirEspecia: producirEspecia, producirBlend: producirBlend,\n  getProducciones: getProducciones, deleteProduccion: deleteProduccion,\n  getFrascosParaVender: getFrascosParaVender,\n  getVentas: getVentas, saveVenta: saveVenta, deleteVenta: deleteVenta,\n  getUsuarios: getUsuarios, saveUsuario: saveUsuario, deleteUsuario: deleteUsuario,\n  authenticateUser: authenticateUser, getCurrentUser: getCurrentUser, logoutUser: logoutUser,\n  getStats: getStats,\n  findEspeciaByName: findEspeciaByName,\n  importFromExcelData: importFromExcelData,\n  getTiendaProductos: getTiendaProductos,\n  toggleTienda: toggleTienda,\n  getProductTags: getProductTags, getTagsForCategoria: getTagsForCategoria,\n  addProductTag: addProductTag, removeProductTag: removeProductTag,\n  compressImage: compressImage,\n  DB_KEY: DB_KEY, FB_PATH: FB_PATH\n};","js/pages.js":"/* ===================== ARCANO V3 — PAGES (FIXED) ===================== */\nconst Pages = {\n\n  /* ================================================================\n     DASHBOARD\n     ================================================================ */\n  renderDashboard(container) {\n    var s = ArcanoDB.getStats();\n    var ultimasVentas = ArcanoDB.getVentas().slice(0, 5);\n    var ultimasProd = ArcanoDB.getProducciones().slice(0, 5);\n    var pedidosNuevos = ArcanoDB.getPedidos().filter(function(p) { return p.estado === 'nuevo' bled = true;\n    }\n\n    function updatePreview() {\n      var tipo = tipoSel.value;\n      var prodId = Number(prodSel.value);\n      var talla = tallaSel.value;\n      var cant = Number(cantInput.value) || 0;\n      if (!prodId || cant <= 0) { previewDiv.innerHTML = ''; prodBtn.disabled = true; return; }\n\n      var producto = tipo === 'blend' ? ArcanoDB.getBlend(prodId) : ArcanoDB.getEspecia(prodId);\n      if (!producto) { previewDiv.innerHTML = '<p class=\"text-red\">Producto no encontrado<\/p>'; prodBtn.disabled = true; return; }\n\n      var db = ArcanoDB.getDB();\n      var envases = db.stockEnvases || { chico: 0, grande: 0 };\n      var allOk = true;\n      var h = '<div class=\"card\"><div class=\"card-body\">' +\n        '<p class=\"fw7 mb-8\">Producir ' + cant + ' frasco' + (cant>1?'s':'') + ' ' + talla + ' de <span class=\"text-gold\">' + producto.nombre + '<\/span><\/p>';\n\n      if (tipo === 'especia') {\n        var gpf = talla === 'grande' ? (Number(producto.gramosGrande)||0) : (Number(producto.gramosChico)||0);\n        var grsTotal = gpf * cant;\n        var bolsaOk = (producto.stockBolsa||0) >= grsTotal;\n        if (!bolsaOk) allOk = false;\n        h += '<div class=\"list-row\"><span>Pala de ' + producto.nombre + '<\/span><span class=\"' + (bolsaOk?'text-green':'text-red fw7') + '\">' + (producto.stockBolsa||0) + 'g disponible → necesita ' + grsTotal + 'g ' + (bolsaOk?'OK':'FALTA') + '<\/span><\/div>';\n      } else {\n        // Blend ingredients\n        var ings = producto.ingredientes || [];\n        if (ings.length === 0) {\n          h += '<p class=\"text-red\">Este blend no tiene ingredientes definidos. Editalo primero.<\/p>';\n          allOk = false;\n        } else {\n          for (var i = 0; i < ings.length; i++) {\n            var esp = ArcanoDB.getEspecia(ings[i].especiaId);\n            var gpf2 = talla === 'grande' ? (Number(ings[i].gramosGrande)||0) : (Number(ings[i].gramosChico)||0);\n            var needed = gpf2 * cant;\ .addEventListener('change', updatePreview);\n    tallaSel.addEventListener('change', updatePreview);\n    cantInput.addEventListener('input', updatePreview);\n\n    // PRODUCE BUTTON — the critical missing handler\n    prodBtn.addEventListener('click', function() {\n      var tipo = tipoSel.value;\n      var prodId = Number(prodSel.value);\n      var talla = tallaSel.value;\n      var cant = Number(cantInput.value) || 0;\n      if (!prodId || cant <= 0) { alert('Selecciona producto y cantidad'); return; }\n      try {\n        if (tipo === 'blend') {\n          ArcanoDB.producirBlend(prodId, talla, cant);\n        } else {\n          ArcanoDB.producirEspecia(prodId, talla, cant);\n        }\n        modal.remove();\n        App.renderPage(App.currentPage);\n      } catch (err) { alert('Error: ' + err.message); }\n    });\n\n    // Preset values if called from Productos\n    if (presetTipo) tipoSel.value = presetTipo;\n    loadProductos();\n    if (presetProdId) {\n      prodSel.value = presetProdId;\n      updatePreview();\n    }\n  },\n\n  /* ================================================================\n     VENTAS\n     ================================================================ */\n  renderVentas(container) {\n    var ventas = ArcanoDB.getVentas();\n    var h = '<div class=\"page-actions\"><button class=\"btn btn-gold\" onclick=\"Pages.formVenta()\">+ Nueva Venta<\/button><\/div>';\n    h += '<div class=\"card mt-16\"><div class=\"card-header\"><h3>Historial<\/h3><\/div><div class=\"card-body\">';\n    if (ventas.length === 0) {\n      h += '<p class=\"text-muted text-center\">Sin ventas.<\/p>';\n    } else {\n      h += '<div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>Fecha<\/th><th>Items<\/th><th>Total<\/th><th><\/th><\/tr><\/thead><tbody>';\n      for (var i = 0; i < Math.min(ventas.length, 30); i++) {\n        var v = ventas[i];\n        var desc = (v.items||[]).map(function(it){ return (it.productoNombre||'?')+' '+(it.talla||'chico') n      var tallaLabel = it.talla === 'grande' ? 'Grande' : 'Chico';\n      h += '<tr><td class=\"fw7\">' + (it.nombre || '?') + '<\/td><td>' + tallaLabel + '<\/td><td>' + (it.qty || 0) + '<\/td><td>$' + (it.precio || 0).toLocaleString() + '<\/td><td class=\"fw7\">$' + (it.subtotal || 0).toLocaleString() + '<\/td><\/tr>';\n    }\n    h += '<\/tbody><\/table><\/div>';\n    h += '<div style=\"text-align:right;margin-top:12px;font-size:1.2rem\" class=\"fw7\">Total: $' + (p.total || 0).toLocaleString() + '<\/div>';\n\n    // Estado buttons\n    h += '<div class=\"mt-16\"><h4>Cambiar Estado<\/h4><div class=\"mt-8\" style=\"display:flex;gap:8px;flex-wrap:wrap\">';\n    for (var ei = 0; ei < estados.length; ei++) {\n      var est = estados[ei];\n      var isActive = p.estado === est;\n      var btnClass = isActive ? 'btn btn-gold' : 'btn btn-outline';\n      h += '<button class=\"' + btnClass + ' btn-sm\" onclick=\"Pages.cambiarEstadoPedido(\\'' + pedidoKey + '\\',\\'' + est + '\\')\">' + estadoLabels[est] + '<\/button>';\n    }\n    h += '<\/div><\/div>';\n\n    h += '<\/div><div class=\"modal-footer\"><button class=\"btn btn-outline\" onclick=\"document.getElementById(\\'pedido-modal\\').remove()\">Cerrar<\/button>';\n    h += '<a class=\"btn btn-gold\" href=\"tel:' + (cl.telefono || '') + '\" target=\"_blank\">Llamar Cliente<\/a>';\n    h += '<button class=\"btn btn-sm\" style=\"color:var(--red);border:1px solid var(--red);margin-left:auto\" onclick=\"Pages.eliminarPedido(\\'' + pedidoKey + '\\')\">Eliminar Pedido<\/button>';\n    h += '<\/div><\/div>';\n\n    var modal = document.createElement('div');\n    modal.className = 'modal-overlay';\n    modal.id = 'pedido-modal';\n    modal.onclick = function(e) { if (e.target === modal) modal.remove(); };\n    modal.innerHTML = '<div class=\"modal modal-lg\" style=\"max-width:680px\">' + h + '<\/div>';\n    document.body.appendChild(modal);\n  },\n\n  cambiarEstadoPedido(pedidoKey, nuevoEstado) {\n    ArcanoDB.updatePedidoEsta \"g2\">' +\n          '<div class=\"form-group\"><label>Grs por Frasco Chico<\/label><input type=\"number\" class=\"input\" id=\"f-import-gc\" value=\"30\" min=\"1\"><\/div>' +\n          '<div class=\"form-group\"><label>Grs por Frasco Grande<\/label><input type=\"number\" class=\"input\" id=\"f-import-gg\" value=\"80\" min=\"1\"><\/div>' +\n        '<\/div>' +\n        '<div id=\"f-import-status\" class=\"mt-12\"><\/div>' +\n        '<div id=\"f-import-preview\" class=\"mt-12\" style=\"display:none\"><\/div>' +\n      '<\/div>' +\n      '<div class=\"modal-footer\" id=\"f-import-footer\">' +\n        '<button class=\"btn btn-outline\" onclick=\"this.closest(\\'.modal-overlay\\').remove()\">Cancelar<\/button>' +\n        '<button class=\"btn btn-gold\" id=\"btn-parse-excel\" disabled>Analizar<\/button>' +\n      '<\/div>' +\n    '<\/div>';\n    document.body.appendChild(modal);\n\n    var fileInput = document.getElementById('f-import-file');\n    var parseBtn = document.getElementById('btn-parse-excel');\n    var statusDiv = document.getElementById('f-import-status');\n    var previewDiv = document.getElementById('f-import-preview');\n    var footerDiv = document.getElementById('f-import-footer');\n\n    // Enable parse button when file selected\n    fileInput.addEventListener('change', function() {\n      parseBtn.disabled = !fileInput.files.length;\n    });\n\n    // Parse Excel\n    parseBtn.addEventListener('click', function() {\n      parseBtn.disabled = true;\n      statusDiv.innerHTML = '<p class=\"text-muted\">Leyendo archivo...<\/p>';\n      previewDiv.style.display = 'none';\n\n      var reader = new FileReader();\n      reader.onload = function(e) {\n        try {\n          var data = new Uint8Array(e.target.result);\n          var workbook = XLSX.read(data, { type: 'array' });\n\n          // Parse ESPECIAS sheet\n          var especiasList = [];\n          var espSheet = workbook.Sheets['ESPECIAS'];\n          if (espSheet) {\n            var espData = XLSX.utils.sheet_to_json(espSheet, { header: 1 });\n            for (var i = 1; i < espData.length; i++) {\n              var row = espData[i];\n              var nombre = (row[0] || '').toString().trim();\n              if (!nombre || nombre.toLowerCase() === 'especia / ingrediente') continue;\n              especiasList.push({ nombre: nombre, categoria: 'Comidas' });\n            }\n          }\n\n          // Parse BLENDS sheet\n          var blendsList = [];\n          var blSheet = workbook.Sheets['BLENDS'];\n          if (blSheet) {\n            var blData = XLSX.utils.sheet_to_json(blSheet, { header: 1 });\n            var currentBlend = null;\n            for (var j = 1; j < blData.length; j++) {\n              var row = blData[j];\n              if (!row) continue;\n              var firstCol = row[0] ? (row[0] || '').toString().trim() : '';\n              var ingCol = row[3] ? (row[3] || '').toString().trim() : '';\n\n              if (firstCol) {\n                // New blend row — save previous if any\n                if (currentBlend && currentBlend.ingredientes.length > 0) {\n                  blendsList.push(currentBlend);\n                }\n                currentBlend = {\n                  nombre: firstCol,\n                  region: (row[1] || '').toString().trim(),\n                  uso: (row[2] || '').toString().trim(),\n                  ingredientes: []\n                };\n              }\n\n              // This row has an ingredient (either on the blend header row or on subsequent rows)\n              if (currentBlend && ingCol) {\n                currentBlend.ingredientes.push({\n                  especia: ingCol,\n                  g: Number(row[4]) || 0,\n                  pct: Number(row[5]) || 0\n                });\n              }\n            }\n            if (currentBlend && currentBlend.ingredientes.length > 0) {\n              blendsList.push(currentBlend);\n            }\n          }\n\n          if (especiasList.length === 0 && blendsList.length === 0) {\n            statusDiv.innerHTML = '<p class=\"text-red\">No se encontraron datos. Asegurate que el Excel tenga las hojas ESPECIAS y BLENDS.<\/p>';\n            parseBtn.disabled = false;\n            return;\n          }\n\n          // Check for existing\n          var existEsp = 0;\n          var existBl = 0;\n          var allEspecias = ArcanoDB.getEspecias();\n          var allBlends = ArcanoDB.getBlends();\n          for (var i = 0; i < especiasList.length; i++) {\n            if (ArcanoDB.findEspeciaByName(especiasList[i].nombre)) existEsp++;\n          }\n          for (var j = 0; j < blendsList.length; j++) {\n            for (var k = 0; k < allBlends.length; k++) {\n              if (allBlends[k].nombre.toLowerCase() === blendsList[j].nombre.toLowerCase()) { existBl++; break; }\n            }\n          }\n\n          // Check unresolved ingredients (mirroring db.js findEspeciaByName logic)\n          var unresolved = [];\n          for (var j = 0; j < blendsList.length; j++) {\n            for (var ii = 0; ii < blendsList[j].ingredientes.length; ii++) {\n              var ingName = blendsList[j].ingredientes[ii].especia;\n              var found = false;\n              // Check existing especias in DB\n              if (ArcanoDB.findEspeciaByName(ingName)) { found = true; }\n              // Check in especiasList (to be created)\n              if (!found) {\n                var target = ingName.trim().toLowerCase();\n                for (var ei = 0; ei < especiasList.length; ei++) {\n                  var ename = especiasList[ei].nombre.trim().toLowerCase();\n                  if (ename === target) { found = true; break; }\n                  if (ename.indexOf(target) === 0 || target.indexOf(ename) === 0) { found = true; break; }\n                  // Word overlap\n                  var words = target.split(/[\\s()\\/,]+/).filter(function(w){return w.length>=4});\n                  for (var wi = 0; wi < words.length; wi++) {\n                    if (ename.indexOf(words[wi]) >= 0) { found = true; break; }\n                  }\n                  if (found) break;\n                }\n              }\n              if (!found) unresolved.push(blendsList[j].nombre + ' -> ' + ingName);\n            }\n          }\n\n          // Show preview\n          var gramosChico = Number(document.getElementById('f-import-gc').value) || 30;\n          var gramosGrande = Number(document.getElementById('f-import-gg').value) || 80;\n\n          var phtml = '<div class=\"card\"><div class=\"card-header\"><h3>Vista Previa<\/h3><\/div><div class=\"card-body\">';\n          phtml += '<div class=\"stats-grid mb-12\" style=\"grid-template-columns:repeat(4,1fr)\">' +\n            '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:var(--green)\">' + especiasList.length + '<\/div><div class=\"stat-label\">Especias en Excel<\/div><\/div>' +\n            '<div class=\"stat-card\"><div class=\"stat-value\">' + blendsList.length + '<\/div><div class=\"stat-label\">Blends en Excel<\/div><\/div>' +\n            '<div class=\"stat-card\"><div class=\"stat-value\" style=\"font-size:1rem\">' + gramosChico + 'g / ' + gramosGrande + 'g<\/div><div class=\"stat-label\">Frasco Ch/Gr<\/div><\/div>' +\n            '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:' + (unresolved.length > 0 ? 'var(--red)' : 'var(--green)') + '\">' + unresolved.length + '<\/div><div class=\"stat-label\">Ingredientes sin resolver<\/div><\/div>' +\n          '<\/div>';\n\n          if (existEsp > 0 || existBl > 0) {\n            phtml += '<p class=\"text-sm text-muted mb-8\">' +\n              (existEsp > 0 ? '<span class=\"badge badge-yellow mr-8\">' + existEsp + ' especias ya existen (se omiten)<\/span>' : '') +\n              (existBl > 0 ? '<span class=\"badge badge-yellow mr-8\">' + existBl + ' blends ya existen (se omiten)<\/span>' : '') +\n            '<\/p>';\n          }\n\n          if (unresolved.length > 0) {\n            phtml += '<div class=\"mb-8\"><p class=\"text-red fw7 mb-4\">Ingredientes que no se pudieron resolver:<\/p>' +\n              '<div style=\"max-height:120px;overflow-y:auto;font-size:0.78rem;color:var(--red)\">' +\n              unresolved.map(function(u) { return '<div>' + u + '<\/div>'; }).join('') +\n              '<\/div><p class=\"text-xs text-muted mt-4\">Estos ingredientes no se vincularan a los blends.<\/p><\/div>';\n          }\n\n          // Sample blends\n          phtml += '<p class=\"fw7 mt-8 mb-4\">Ejemplos de blends a crear:<\/p>';\n          var sampleBlends = blendsList.slice(0, 5);\n          for (var s = 0; s < sampleBlends.length; s++) {\n            var sb = sampleBlends[s];\n            phtml += '<div class=\"list-row\" style=\"flex-direction:column;align-items:flex-start;gap:2px\">' +\n              '<span class=\"fw7 text-gold\">' + sb.nombre + '<\/span>' +\n              '<span class=\"text-xs text-muted\">' + (sb.region ? sb.region + ' | ' : '') + (sb.uso || '') + ' | ' + sb.ingredientes.length + ' ingredientes<\/span>' +\n              '<span class=\"text-xs text-muted\">' + sb.ingredientes.map(function(ing) {\n                var gc = Math.round((ing.g / 500) * gramosChico * 100) / 100;\n                return ing.especia + ' ' + ing.g + 'g → ' + gc + 'g/frasco';\n              }).join(' + ') + '<\/span><\/div>';\n          }\n          if (blendsList.length > 5) phtml += '<p class=\"text-xs text-muted mt-4\">... y ' + (blendsList.length - 5) + ' blends mas<\/p>';\n\n          phtml += '<\/div><\/div>';\n          previewDiv.innerHTML = phtml;\n          previewDiv.style.display = 'block';\n\n          // Replace footer with Confirm button\n          footerDiv.innerHTML =\n            '<button class=\"btn btn-outline\" onclick=\"this.closest(\\'.modal-overlay\\').remove()\">Cancelar<\/button>' +\n            '<button class=\"btn btn-gold\" id=\"btn-do-import\">Confirmar Importacion (' + (especiasList.length - existEsp) + ' n-sm btn-red';\n      rmBtn.style.marginTop = '6px';\n      rmBtn.textContent = 'Quitar imagen';\n      rmBtn.onclick = function() { Pages.removeImage(areaId, input.id); };\n      area.insertBefore(rmBtn, placeholder);\n    });\n  },\n\n  removeImage(areaId, inputId) {\n    var area = document.getElementById(areaId);\n    var preview = area.querySelector('.img-preview');\n    if (preview) preview.remove();\n    var btn = area.querySelector('.btn-red');\n    if (btn) btn.remove();\n    var placeholder = area.querySelector('.img-upload-placeholder');\n    if (placeholder) placeholder.style.display = '';\n    var inp = document.getElementById(inputId);\n    if (inp) inp.value = '';\n  },\n\n  /* ================================================================\n     RECETAS IA  (Groq API — modelo opensource Llama 3.3 70B)\n     ================================================================ */\n  renderRecetasAdmin(container) {\n    var savedKey = localStorage.getItem('arcano_groq_key') || '';\n    var categorias = ['Comida', 'Bebidas', 'Postres', 'Snacks', 'Salsas', 'Otros'];\n\n    // Build list of available products for context\n    var productos = ArcanoDB.getTiendaProductos();\n    var productNames = [];\n    for (var i = 0; i < productos.length; i++) productNames.push(productos[i].nombre);\n    var productsContext = productNames.length > 0 ? productNames.join(', ') : 'No hay productos disponibles';\n\n    var h = '<div class=\"card mb-16\">' +\n      '<div class=\"card-header\"><h3>Configuracion<\/h3><\/div>' +\n      '<div class=\"card-body\">' +\n        '<p class=\"text-sm text-muted mb-12\">Usa <a href=\"https://console.groq.com/keys\" target=\"_blank\" style=\"color:var(--gold)\">Groq Console<\/a> para obtener tu API key gratis. Modelo: <b>Llama 3.3 70B<\/b> (opensource).<\/p>' +\n        '<div class=\"form-group\"><label>Groq API Key<\/label>' +\n        '<input type=\"password\" class=\"input\" id=\"ra-groq-key\" value=\"' + savedKey + '\" placeholder=\"gsk_xxxx...\">' +\n        '<\/div>' +\n        '<div class=\"g2\">' +\n          '<div class=\"form-group\"><label>Categoria<\/label>' +\n          '<select class=\"input\" id=\"ra-categoria\">';\n    for (var c = 0; c < categorias.length; c++) {\n      h += '<option value=\"' + categorias[c] + '\">' + categorias[c] + '<\/option>';\n    }\n    h += '<\/select><\/div>' +\n          '<div class=\"form-group\"><label>Tema de la receta (opcional)<\/label>' +\n          '<input type=\"text\" class=\"input\" id=\"ra-tema\" placeholder=\"Ej: arroz con leche, adobo de pollo...\">' +\n          '<\/div>' +\n        '<\/div>' +\n        '<div class=\"form-group\"><label>Idioma de salida<\/label>' +\n        '<select class=\"input\" id=\"ra-idioma\">' +\n          '<option value=\"es\">Espanol<\/option>' +\n          '<option value=\"en\">English<\/option>' +\n        '<\/select><\/div>' +\n        '<button class=\"btn btn-gold\" id=\"ra-gen-btn\" onclick=\"Pages.generarReceta()\">Generar Receta con IA<\/button>' +\n        '<span id=\"ra-gen-status\" class=\"text-sm text-muted ml-12\"><\/span>' +\n      '<\/div>' +\n    '<\/div>';\n\n    // Existing recipes section\n    h += '<div class=\"card\">' +\n      '<div class=\"card-header\"><h3>Recetas Existentes (' + '<span id=\"ra-count\">0<\/span>' + ')<\/h3><\/div>' +\n      '<div class=\"card-body\" id=\"ra-list\"><div class=\"text-center text-muted\">Cargando...<\/div><\/div>' +\n    '<\/div>';\n\n    container.innerHTML = h;\n\n    // Load existing recipes from Firebase\n    Pages._loadRecetasAdmin();\n  },\n\n  _loadRecetasAdmin: function() {\n    var ref = firebase.database().ref('arcano/db/recetas').orderByChild('fecha');\n    ref.once('value', function(snap) {\n      var data = snap.val();\n      var recetas = [];\n      if (data) {\n        var keys = Object.keys(data);\n        for (var i = 0; i < keys.length; i++) {\n          var r = data[keys[i]];\n          r._key = keys[i];\n          recetas.push(r);\n        }\n      }\n      recetas.sort(function(a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); });\n      Pages._renderRecetasList(recetas);\n    });\n  },\n\n  _renderRecetasList: function(recetas) {\n    var countEl = document.getElementById('ra-count');\n    var listEl = document.getElementById('ra-list');\n    if (!countEl || !listEl) return;\n    countEl.textContent = recetas.length;\n    if (recetas.length === 0) {\n      listEl.innerHTML = '<p class=\"text-center text-muted\">No hay recetas. Genera la primera con el boton de arriba.<\/p>';\n      return;\n    }\n    var h = '<div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>Titulo<\/th><th>Categoria<\/th><th>Tiempo<\/th><th>Fecha<\/th><th><\/th><\/tr><\/thead><tbody>';\n    for (var i = 0; i < recetas.length; i++) {\n      var r = recetas[i];\n      h += '<tr>' +\n        '<td class=\"fw7\">' + (r.titulo || 'Sin titulo') + '<\/td>' +\n        '<td><span class=\"badge badge-gold\">' + (r.categoria || '') + '<\/span><\/td>' +\n        '<td>' + (r.tiempo || '-') + '<\/td>' +\n        '<td class=\"text-sm text-muted\">' + (r.fecha || '') + '<\/td>' +\n        '<td><button class=\"btn btn-sm btn-red\" onclick=\"Pages.borrarReceta(\\'' + r._key + '\\')\">Eliminar<\/button><\/td>' +\n        '<\/tr>';\n    }\n    h += '<\/tbody><\/table><\/div>';\n    listEl.innerHTML = h;\n  },\n\n  borrarReceta: function(key) {\n    if (!confirm('Eliminar esta receta?')) return;\n    firebase.database().ref('arcano/db/recetas/' + key).remove(function() {\n      Pages._loadRecetasAdmin();\n    });\n  },\n\n  generarReceta: function() {\n    var keyInput = document.getElementById('ra-groq-key');\n    var catSelect = document.getElementById('ra-categoria');\n    var temaInput = document.getElementById('ra-tema');\n    var idiomaSelect = document.getElementById('ra-idioma');\n    var btn = document.getElementById('ra-gen-btn');\n    var status = document.getElementById('ra-gen-status');\n\n    var apiKey = keyInput.value.trim();\n    var categoria = catSelect.value;\n    var tema = temaInput.value.trim();\n    var idioma = idiomaSelect.value;\n\n    if (!apiKey) { alert('Ingresa tu Groq API Key'); keyInput.focus(); return; }\n    localStorage.setItem('arcano_groq_key', apiKey);\n\n    // Build product context\n    var productos = ArcanoDB.getTiendaProductos();\n    var nombres = [];\n    for (var i = 0; i < productos.length; i++) nombres.push(productos[i].nombre);\n    var productContext = nombres.length > 0 ? nombres.join(', ') : 'especias y blends variados';\n\n    var langInstr = idioma === 'en'\n      ? 'Respond ONLY in English. All fields (titulo, descripcion, ingredientes, pasos) must be in English.'\n      : 'Responde SOLO en espanol. Todos los campos (titulo, descripcion, ingredientes, pasos) deben estar en espanol.';\n\n    var temaInstr = tema\n      ? 'El tema especifico es: ' + tema + '.'\n      : 'Inventa un tema creativo y apetitoso.';\n\n    var systemPrompt =\n      'Eres un chef experto en especias y blends artesanales de la marca Arcano Especias. ' +\n      'Tu especialidad es crear recetas deliciosas que resalten los sabores de las especias. ' +\n      'Los productos disponibles son: ' + productContext + '. ' +\n      'Si es posible, usa al menos uno de estos productos en la receta. ' +\n      langInstr;\n\n    var userPrompt =\n      'Genera una receta de categoria \"' + categoria + '\". ' + temaInstr + '\\n\\n' +\n      'Responde EXCLUSIVAMENTE con un JSON valido (sin markdown, sin backticks, sin texto antes o despues) con esta estructura exacta:\\n' +\n      '{\"titulo\": \"...\", \"descripcion\": \"... (2-3 oraciones)\", \"categoria\": \"' + categoria + '\", ' +\n      '\"tiempo\": \"... (ej: 30 min)\", \"porciones\": \"... (ej: 4 porciones)\", ' +\n      '\"ingredientes\": [\"1 cucharadita de comino\", \"200g de pollo\", ...], ' +\n      '\"pasos\": [\"Paso 1: ...\", \"Paso 2: ...\", ...]}\\n\\n' +\n      'La receta debe ser practica, deliciosa y usar especias de forma creativa. ' +\n      'Entre 4 y 8 ingredientes, entre 4 y 6 pasos.';\n\n    btn.disabled = true;\n    btn.textContent = 'Generando...';\n    status.textContent = 'Consultando Llama 3.3 70B via Groq...';\n\n    fetch('https://api.groq.com/openai/v1/chat/completions', {\n      method: 'POST',\n      headers: {\n        'Authorization': 'Bearer ' + apiKey,\n        'Content-Type': 'application/json'\n      },\n      body: JSON.stringify({\n        model: 'llama-3.3-70b-versatile',\n        temperature: 0.8,\n        max_tokens: 1024,\n        messages: [\n          { role: 'system', content: systemPrompt },\n          { role: 'user', content: userPrompt }\n        ]\n      })\n    })\n    .then(function(res) {\n      if (!res.ok) return res.json().then(function(e) { throw new Error((e.error && e.error.message) || 'Error ' + res.status); });\n      return res.json();\n    })\n    .then(function(data) {\n      var content = data.choices[0].message.content.trim();\n      // Strip markdown code blocks if present\n      content = content.replace(/^```json?\\s*/i, '').replace(/\\s*```$/, '');\n      var receta = JSON.parse(content);\n\n      // Validate structure\n      if (!receta.titulo) throw new Error('La receta no tiene titulo');\n      if (!Array.isArray(receta.ingredientes)) throw new Error('ingredientes debe ser un array');\n      if (!Array.isArray(receta.pasos)) throw new Error('pasos debe ser un array');\n\n      // Save to Firebase\n      receta.fecha = new Date().toISOString().slice(0, 10);\n      if (!receta.categoria) receta.categoria = categoria;\n      firebase.database().ref('arcano/db/recetas').push(receta, function(err) {\n        if (err) {\n          status.textContent = 'Error al guardar: ' + (err.message || err);\n        } else {\n          status.innerHTML = '<span style=\"color:var(--green)\">Receta guardada: ' + receta.titulo + '<\/span>';\n          Pages._loadRecetasAdmin();\n        }\n        btn.disabled = false;\n        btn.tex  ingredientes seleccionados de cada rincon<\/p>\n    <\/section>\n\n    <div class=\"filters\" id=\"filters\">\n      <button class=\"filter-btn active\" data-cat=\"Todos\">Todos<\/button>\n      <button class=\"filter-btn\" data-cat=\"Comidas\">Comidas<\/button>\n      <button class=\"filter-btn\" data-cat=\"Infusiones\">Infusiones<\/button>\n      <button class=\"filter-btn\" data-cat=\"Cocteleria\">Cocteleria<\/button>\n    <\/div>\n\n    <div class=\"products-grid\" id=\"products-grid\">\n      <div class=\"empty-state\"><p>Cargando productos...<\/p><\/div>\n    <\/div>\n  <\/main>\n\n  <button class=\"cart-fab\" id=\"cart-fab\" style=\"display:none\" onclick=\"openCart()\">\n    <span class=\"cart-count\" id=\"cart-count\">0<\/span> Ver Pedido\n  <\/button>\n\n  <footer class=\"store-footer\">\n    Arcano Especias & Blends &middot; Especias artesanales\n  <\/footer>\n\n  <script src=\"https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js\"><\/script>\n  <script src=\"https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js\"><\/script>\n  <script src=\"js/tienda-data.js\"><\/script>\n  <script src=\"js/tienda-ui.js\"><\/script>\n<\/body>\n<\/html>","css/tienda.css":"/* ===================== ARCANO TIENDA — PUBLIC STORE STYLES ===================== */\n:root {\n  --bg: #faf6f0;\n  --card: #ffffff;\n  --text: #2d1810;\n  --text-muted: #8a7568;\n  --gold: #c8963a;\n  --gold-light: #f5e6c8;\n  --gold-dark: #a07828;\n  --border: #e8ddd0;\n  --green: #2d8a4e;\n  --red: #c0392b;\n  --dark: #1b0b07;\n}\n* { box-sizing: border-box; margin: 0; padding: 0; }\nbody { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }\n\n/* === HEADER === */\n.store-header { background: var(--dark); color: #ece0d0; padding: 14px 20px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 12px rgba(0,0,0,.3); display: flex; align-items: center; gap: 14px; }\n.store-logo { width: 56px; height: 56px; flex-shrink: 0; }\n.store-logo img { width: 100%; height: 100%; object-fit: contain; }\n.store-header-text { display: flex; flex-direction: column; }\n.store-header-text h1 { font-size: 1.3rem; letter-spacing: .15em; color: var(--gold); margin: 0; line-height: 1.2; }\n.store-header-text .sub { font-size: .75rem; color: #9a8a78; letter-spacing: .05em; margin: 0; }\n\n/* === HERO === */\n.hero { text-align: center; padding: 40px 16px 24px; max-width: 560px; margin: 0 auto; }\n.hero h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }\n.hero p { color: var(--text-muted); font-size: .95rem; }\n\n/* === FILTERS === */\n.filters { display: flex; justify-content: center; gap: 8px; padding: 0 16px 20px; flex-wrap: wrap; }\n.filter-btn { padding: 8px 20px; border: 1px solid var(--border); border-radius: 24px; background: var(--card); color: var(--text-muted); cursor: pointer; font-size: .85rem; transition: all .2s; }\n.filter-btn.active, .filter-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold); }\n\n/* === PRODUCT GRID === */\n.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; padding: 0 16px 100px; max-width: 1100px; margin: 0 auto; }\n.product-card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); transition: transform .2s, box-shadow .2s; }\n.product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.07); }\n.card-img { height: 200px; background: linear-gradient(135deg, #1b0b07 0%, #3a1f10 100%); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2.4rem; font-weight: 900; overflow: hidden; cursor: pointer; }\n.card-img img { width: 100%; height: 100%; object-fit: contain; padding: 8px; transition: transform .2s; }\n.card-img:hover img { transform: scale(1.03); }\n.card-img .card-type { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.5); color: #ece0d0; font-size: .65rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }\n.card-body { padding: 14px; }\n.card-name { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }\n.card-meta { font-size: .75rem; color: var(--text-muted); margin-bottom: 10px; min-height: 16px; }\n.card-prices { display: flex; gap: 8px; margin-bottom: 10px; }\n.price-box { flex: 1; background: var(--gold-light); border-radius: 8px; padding: 8px 6px; text-align: center; }\n.price-label { font-size: .65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }\n.price-value { font-weight: 700; color: var(--gold-dark); font-size: .95rem; }\n.price-na { color: var(--text-muted); font-size: .8rem; }\n.stock-badge { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; }\n.stock-ok { background: #e8f5e9; color: var(--green); }\n.stock-low { background: #fff3e0; color: #e65100; }\n.add-btn { width: 100%; padding: 9px; border: 2px solid var(--gold); border-radius: 8px; background: transparent; color: var(--gold); font-weight: 700; font-size: .85rem; cursor: pointer; transition: all .2s; }\n.add-btn:hover { background: var(--gold); color: #fff; }\n.add-btn:disabled { opacity: .4; cursor: not-allowed; }\n\n/* === CART FAB === */\n.cart-fab { position: fixed; bottom: 20px; right: 20px; background: var(--gold); color: #fff; padding: 14px 22px; border-radius: 26px; font-weight: 700; font-size: .9rem; cursor: pointer; box-shadow: 0 4px 16px rgba(200,150,58,.4); z-index: 100; border: none; display: flex; align-items: center; gap: 8px; }\n.cart-fab .cart-count { background: var(--dark); color: var(--gold); width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; }\n\n/* === MODAL === */\n.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center;
